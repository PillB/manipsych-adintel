[project]
name = "manipsych"
version = "0.1.0"
description = "Local defensive research system for manipulation detection."
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "playwright>=1.40",
    "selenium>=4.15",
    "webdriver-manager>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "scikit-learn>=1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
